name: CI

# CI untuk hermes-monitor-kuliah (repo P1 #46 — automation monitor kuliah
# Python + landing statis papan jadwal kampus).
# Job:
#   python-test    — py_compile semua .py + pytest tests/ (11 tes: jadwal,
#                    jendela absen, parser absensi, runner demo, scheduler).
#                    Tanpa jaringan, tanpa kredensial, tanpa login nyata.
#   lint-ruff      — ruff check (E4/E7/E9/F, lihat pyproject.toml).
#   gitleaks       — secret-scan SELURUH riwayat (fetch-depth 0). Repo ini
#                    pegang kredensial vault — job ini WAJIB hijau.
#   advisory-sweep — OSV batch (pola repo #24-#43); dependensi produksi
#                    dipin di requirements.txt (PyPI). HIGH/CRITICAL = gagal.
#                    JANGAN pakai npm audit sebagai gate.
#   static-checks  — html-validate Node 24 + gate P0 anti-slop + tag OG.
#   playwright-e2e — landing statis di server lokal (desktop + mobile).
#                    HANYA di CI; Chromium lokal tidak bisa start di VM dev.
#   smoke          — file yang di-deploy ada & tidak kosong.
# Node 24 (html-validate 11 crash di Node 20, pola #29).
# Repo ini TIDAK punya package-lock.json: CI pakai `npm install`
# (bukan `npm ci`) dan TANPA `cache: npm` di setup-node.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python: compile + pytest (tanpa jaringan/kredensial) ───────────────
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile semua modul Python
        run: python3 -m py_compile monitor-kuliah/scripts/*.py monitor-kuliah/saas/*.py monitor-kuliah/saas/py/*.py monitor-kuliah/generate_pdfs.py tests/test_schedule.py scripts/*.py

      - name: Install pytest
        run: pip install pytest

      - name: Uji jadwal + jendela + parser absensi (11 tes)
        run: python3 -m pytest tests/ -q

  # ── Lint: ruff ─────────────────────────────────────────────────────────
  lint-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

  # ── Gitleaks: secret-scan seluruh riwayat ──────────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan (riwayat penuh)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Advisory sweep (OSV batch, tanpa auth) ─────────────────────────────
  advisory-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep dependensi produksi (PyPI) di OSV
        run: python3 scripts/advisory-sweep.py

  # ── Pemeriksaan statis: HTML + gate P0 + tag OG ────────────────────────
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Validasi HTML
        run: npx html-validate index.html

      - name: Gate P0 + tag OG/Twitter + data jadwal
        run: npm run validate

      - name: Unggah package-lock hasil instalasi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: warn

  # ── E2E Playwright (landing statis, HANYA di CI) ──────────────────────
  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E landing (desktop + mobile)
        run: npm run e2e

  # ── Smoke: file deploy ada & tidak kosong ──────────────────────────────
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: File deploy ada & tidak kosong
        run: |
          for f in index.html styles.css app.js favicon.svg og-image.png; do
            test -s "$f" || { echo "FAIL: $f hilang/kosong"; exit 1; }
          done
          echo "OK: semua file deploy ada"
