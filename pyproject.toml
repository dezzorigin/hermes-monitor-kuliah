[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Default ruff (E4/E7/E9/F): error sintaks + import/variabel tak terpakai.
# E501 sengaja TIDAK di-select — skrip lama punya baris panjang
# (regex parser absen_run.py, generate_pdfs.py) yang bukan cacat.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
